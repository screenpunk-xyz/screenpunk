name: ScreenpunkPreviewHost
options:
  bundleIdPrefix: xyz.screenpunk
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: xyz.screenpunk.preview-host
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    INFOPLIST_GENERATION_MODE: GeneratedFile
    GENERATE_INFOPLIST_FILE: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SUPPORTED_PLATFORMS: macosx
packages:
  ScreenpunkCore:
    path: ../../packages/ScreenpunkCore
targets:
  ScreenpunkPreviewHost:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: ScreenpunkCore
    settings:
      base:
        PRODUCT_NAME: ScreenpunkPreviewHost
        LSUIElement: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screenpunk Preview Host
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 the Screenpunk contributors
