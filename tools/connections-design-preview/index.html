<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenpunk · Connections preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#101112;color:#eee;font:14px -apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #ffffff20;background:#ffffff09;border-radius:8px;padding:8px 12px}button:hover{background:#ffffff18}button:disabled{opacity:.4;cursor:default}header.studio{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #ffffff16;color:#aaa}header.studio strong{color:#eee}select,input{color:inherit;background:#292a2c;border:1px solid #ffffff25;border-radius:7px;padding:8px}main{width:min(1100px,calc(100vw - 64px));margin:48px auto;background:#202123;border:1px solid #ffffff26;border-radius:22px;box-shadow:0 30px 100px #0006;overflow:hidden}.title{padding:25px 28px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff14}h1{font-size:23px;margin:0 0 7px}p{line-height:1.5;margin:0;color:#aaa}.layout{display:grid;grid-template-columns:270px 1fr;min-height:520px}aside{background:#191a1c;border-right:1px solid #ffffff14;padding:20px 12px;display:flex;flex-direction:column}.label{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#999;margin:6px 12px 14px}.item{border:0;width:100%;text-align:left;padding:10px 14px;margin:2px 0;display:flex;gap:12px;align-items:center}.item,.light .item{background:transparent}.item:not(.active):hover{background:#ffffff0d}.light .item:not(.active):hover{background:#00000009}.item.active:hover,.light .item.active:hover{background:#4083ee}.item{transition:background 120ms ease}.item.active{background:#3269cb}.item small{display:block;margin-top:5px;opacity:.7}.icon{font-size:23px;width:28px}.add{margin-top:auto;text-align:left}.detail{padding:32px 36px}.detail h2{font-size:25px;margin:0 0 8px}.badge{display:inline-block;padding:5px 9px;border-radius:6px;background:#ffffff0a;color:#a9c5f7;font-size:12px;margin:14px 0 8px}.section{font-size:12px;color:#aaa;margin:24px 0 10px}dl{margin:0;background:#ffffff04;border:1px solid #ffffff10;border-radius:12px;padding:4px 18px}dl div{display:flex;justify-content:space-between;gap:24px;padding:14px 0;border-bottom:1px solid #ffffff0b}dl div:last-child{border:0}dt{color:#aaa}dd{margin:0;text-align:right;max-width:68%;overflow-wrap:anywhere}.note{margin-top:18px;font-size:13px}.actions{display:flex;gap:10px;margin-top:26px}.primary{background:#3478e8;border-color:#3478e8;color:white}.danger{color:#ff9999}footer{padding:16px 26px;border-top:1px solid #ffffff14;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#999}dialog{color:#eee;background:#252629;border:1px solid #ffffff30;border-radius:18px;padding:28px;width:480px;box-shadow:0 30px 100px #000a}dialog::backdrop{background:#0008}dialog h2{margin-top:0}label.field{display:block;margin:18px 0;color:#bbb}label.field input,label.field select{display:block;width:100%;margin-top:7px}.right{justify-content:flex-end}.empty{padding:60px 20px;text-align:center}.light{background:#e8eaee;color:#222}.light main,.light dialog{background:#fafafa;color:#222}.light aside{background:#f0f1f3}.light p,.light dt,.light .section,.light footer{color:#666}.light button{border-color:#0002;background:#00000007}.light .primary,.light .item.active{background:#3478e8;color:white}.light input,.light select{background:#fff;color:#222}.light header.studio strong{color:#222}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#354e34;border-radius:10px;display:none}@media(max-width:800px){main{width:96%;margin:20px auto}.layout{grid-template-columns:220px 1fr}.detail{padding:25px 20px}}
main{display:flex;flex-direction:column;max-height:calc(100vh - 130px)}.title,footer{flex-shrink:0}.layout{min-height:0;height:520px;overflow:hidden;flex:1}.detail,aside{overflow-y:auto}footer .actions{margin:0}footer{font-size:14px;gap:16px}#connectionActions{margin-left:auto}.operations{border:1px solid #ffffff10;border-radius:12px;background:#ffffff04;padding:0 18px}.operation{padding:14px 0;border-bottom:1px solid #ffffff0b}.operation:last-child{border:0}.operation small{display:block;color:#999;margin-top:5px}.light .operations{border-color:#0001;background:#00000003}.detail>.section{margin-top:16px}.connection-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:8px}.connection-heading h2{margin:0}.connection-heading .badge{margin:0;flex-shrink:0}.connection-heading+p{margin-bottom:20px}.operation{display:flex;justify-content:space-between;align-items:baseline;gap:24px}.operation-meta{color:#aaa}.operation-name{text-align:right}.light .operation-meta{color:#666}.badge[data-state="success"]{color:#93d5a4;background:#22492c}.badge[data-state="error"]{color:#ffc0b9;background:#592c2b}.badge[data-state="testing"]{color:#b8d3ff;background:#293e5e}</style><header class="studio"><div><strong>Connections design studio</strong> · Interactive sample data</div><div style="display:flex;align-items:center;gap:14px"><label>Sample test result <select id="testOutcome"><option>Success</option><option>Failure</option></select></label><label>Device <select id="deviceState"><option>Connected</option><option>Offline</option></select></label><button id="theme">Light appearance</button></div></header><main><div class="title"><div><h1>Bathroom iPad Connections</h1><p>Connections used by screens on this iPad</p></div></div><div class="layout"><aside><div class="label">Current connections</div><div id="list"></div></aside><section class="detail" id="detail"></section></div><footer><div id="connectionActions"></div></footer></main><dialog id="form"><h2>Configure Home Assistant</h2><label class="field">Server address<input id="origin" placeholder="http://homeassistant.local:8123"></label><label class="field">Access token<input id="token" type="password" autocomplete="off" placeholder="Leave blank to keep the saved token"></label><p>Save updates this iPad immediately. The iPad must be connected.</p><p id="error" role="status" style="margin-top:12px"></p><div class="actions right"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div></dialog><div id="toast" role="status"></div><script>
const connections=[{id:1,name:'Weather data',origin:'https://api.weather.gov',type:'Public data source',status:'Status not checked',access:'Read only',auth:'None',description:'Public weather forecasts and observations.',operations:'GET · Forecast and observations'},{id:2,name:'Home Assistant',origin:'https://home.example.com',type:'Permission grant',status:'Status not checked',access:'Read only',auth:'Access token',description:'Home automation and entity states.',operations:'GET · Selected entity states'}];let selected=1,editing=null;const $=id=>document.getElementById(id);function text(tag,value){const el=document.createElement(tag);el.textContent=value;return el}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}function render(){const list=$('list');list.replaceChildren();connections.forEach(c=>{const b=document.createElement('button');b.className='item'+(selected===c.id?' active':'');const icon=text('span',c.type==='Public data source'?'☁':'⇄');icon.className='icon';const label=text('span',c.name);label.append(text('small',c.type));b.append(icon,label);b.onclick=()=>{selected=c.id;render()};list.append(b)});const d=$('detail');d.replaceChildren();$('connectionActions').replaceChildren();const c=connections.find(c=>c.id===selected);if(!c){d.append(text('h2','No connections'),text('p','Connections appear here when installed screens use them.'));return}const heading=document.createElement('div');heading.className='connection-heading';heading.append(text('h2',c.name));d.append(heading,text('p',c.description));const badge=text('div',c.status);badge.className='badge';heading.append(badge);const detailsHeading=text('div','Access details');detailsHeading.className='section';d.append(detailsHeading);const dl=document.createElement('dl');[['Destination',c.origin],['Access',c.access],['Authentication',c.auth],['Used by',c.type==='Public data source'?'Weather · Daily information':'Home controls']].forEach(([k,v])=>{const row=document.createElement('div');row.append(text('dt',k),text('dd',v));dl.append(row)});d.append(dl);const operationsTitle=text('div','Operations');operationsTitle.className='section';d.append(operationsTitle);const operations=document.createElement('div');operations.className='operations';const entries=c.type==='Public data source'?[{name:'Fetch forecast',method:'GET',access:'Read only',screens:'Weather · Daily information'},{name:'Fetch current observations',method:'GET',access:'Read only',screens:'Weather'}]:[{name:'Fetch entity states',method:'GET',access:'Read only'}];entries.forEach(op=>{const row=document.createElement('div');row.className='operation';const description=text('span',op.method+' · '+op.access);description.className='operation-meta';const label=text('span',op.name);label.className='operation-name';if(op.screens){const usage=text('small',op.screens);usage.className='operation-screens';label.append(usage)}row.append(description,label);operations.append(row)});d.append(operations);const actions=document.createElement('div');actions.className='actions';if(c.type!=='Public data source'){const configure=text('button','Configure connection');configure.onclick=()=>openForm(c);actions.append(configure)}const test=text('button','Test connection');test.className='primary';badge.setAttribute('role','status');badge.title='Source test from this Mac; does not check the iPad.';if(c.testState){badge.textContent=c.testState;badge.dataset.state=c.testState==='Source reachable'?'success':'error'}test.onclick=()=>{test.disabled=true;test.textContent='Testing…';badge.textContent='Testing';badge.dataset.state='testing';badge.title='Checking the source from this Mac';const outcome=$('testOutcome').value;setTimeout(()=>{test.disabled=false;test.textContent='Test again';c.testState=outcome==='Success'?'Source reachable':'Test failed';badge.textContent=c.testState;badge.dataset.state=outcome==='Success'?'success':'error';badge.title=(outcome==='Success'?'Expected data received':'Could not reach the source')+' · Checked from this Mac just now';},800)};actions.append(test);$('connectionActions').append(actions)}
function openForm(c){editing=c;$('origin').value=c.configuredOrigin||c.origin;$('token').value='';$('error').textContent='';updateSaveAvailability();$('form').showModal()}
$('form').addEventListener('close',()=>{$('token').value=''});
$('cancel').onclick=()=>$('form').close();
let saving=false;
function updateSaveAvailability(){const offline=$('deviceState').value==='Offline';$('save').disabled=offline||saving;if(offline)$('error').textContent='iPad offline. Reconnect it to save changes.';else if(!saving)$('error').textContent=''}
$('deviceState').onchange=updateSaveAvailability;
$('save').onclick=()=>{if(saving||$('deviceState').value!=='Connected'){updateSaveAvailability();return}try{const u=new URL($('origin').value);if(!['https:','http:'].includes(u.protocol)||u.username||u.password)throw Error();const target=editing;const origin=u.origin;saving=true;$('save').disabled=true;$('save').textContent='Saving…';$('error').textContent='Waiting for the iPad to confirm…';setTimeout(()=>{saving=false;$('save').textContent='Save';if($('deviceState').value!=='Connected'){updateSaveAvailability();return}target.origin=origin;target.configuredOrigin=origin;delete target.testState;$('token').value='';$('form').close();render();toast('Connection updated on Bathroom iPad');updateSaveAvailability()},800)}catch{$('error').textContent='Enter a valid HTTP or HTTPS server address without embedded credentials.'}};
$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark appearance':'Light appearance'};render();
</script></html>
