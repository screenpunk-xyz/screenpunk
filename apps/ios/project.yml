name: ScreenpunkiOS
options:
  bundleIdPrefix: xyz.screenpunk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: xyz.screenpunk.ios
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    SCREENPUNK_CLOUD_GOOGLE_CALLBACK_SCHEME: ""
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Screenpunk
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Screenpunk pairs with your Mac and connects directly to approved services such as Home Assistant and Google TV on your local network.
    # NSBonjourServices is an array and has no INFOPLIST_KEY_ build setting, so it
    # lives in Info.plist; Xcode merges the generated keys into that file.
    INFOPLIST_FILE: Info.plist
  configs:
    Debug:
      SCREENPUNK_GOOGLE_CALENDAR_CLIENT_ID: 1055084253934-u2ekaq5cjrt3csutibvt550ms35bp2vr.apps.googleusercontent.com
      SCREENPUNK_GOOGLE_CALENDAR_REVERSED_CLIENT_ID: com.googleusercontent.apps.1055084253934-u2ekaq5cjrt3csutibvt550ms35bp2vr
    Release:
      # Supply the production client explicitly; never fall back to Dev.
      SCREENPUNK_GOOGLE_CALENDAR_CLIENT_ID: ""
      SCREENPUNK_GOOGLE_CALENDAR_REVERSED_CLIENT_ID: ""
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
  ScreenpunkCore:
    path: ../../packages/ScreenpunkCore
  ScreenpunkApple:
    path: ../../packages/ScreenpunkApple
targets:
  ScreenpunkiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../assets/brand/app-icon/Screenpunk.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: ScreenpunkCore
      - package: ScreenpunkApple
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_NAME: Screenpunk
        ASSETCATALOG_COMPILER_APPICON_NAME: Screenpunk
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Screenpunk, Inc.
  ScreenpunkAudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../packages/ScreenpunkApple/Tests/ScreenpunkAppleTests/BundledAudioTests.swift
      - path: Tests
    dependencies:
      - target: ScreenpunkiOS
      - package: ScreenpunkApple
      - package: ScreenpunkCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Screenpunk.app/Screenpunk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: xyz.screenpunk.ios.audio-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScreenpunkiOS:
    build:
      targets:
        ScreenpunkiOS: all
        ScreenpunkAudioTests: [test]
    test:
      targets:
        - ScreenpunkAudioTests
