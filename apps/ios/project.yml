name: ScreenpunkiOS
options:
  bundleIdPrefix: xyz.screenpunk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: xyz.screenpunk.ios
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Screenpunk
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Screenpunk pairs with your Mac and connects directly to approved services such as Home Assistant on your local network.
    # NSBonjourServices is an array and has no INFOPLIST_KEY_ build setting, so it
    # lives in Info.plist; Xcode merges the generated keys into that file.
    INFOPLIST_FILE: Info.plist
packages:
  ScreenpunkCore:
    path: ../../packages/ScreenpunkCore
  ScreenpunkApple:
    path: ../../packages/ScreenpunkApple
targets:
  ScreenpunkiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ScreenpunkCore
      - package: ScreenpunkApple
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_NAME: Screenpunk
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Screenpunk, Inc.
  ScreenpunkAudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../packages/ScreenpunkApple/Tests/ScreenpunkAppleTests/BundledAudioTests.swift
    dependencies:
      - target: ScreenpunkiOS
      - package: ScreenpunkApple
      - package: ScreenpunkCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Screenpunk.app/Screenpunk"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: xyz.screenpunk.ios.audio-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScreenpunkiOS:
    build:
      targets:
        ScreenpunkiOS: all
        ScreenpunkAudioTests: [test]
    test:
      targets:
        - ScreenpunkAudioTests
