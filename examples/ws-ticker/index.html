<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WS ticker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-fixture="SCREENPUNK_WS_TICKER_EXAMPLE_V1">
  <main>
    <header class="lockup" data-lockup="stacked">
      <img class="mark light-only" src="mark-light.svg" alt="">
      <img class="mark dark-only" src="mark-dark.svg" alt="">
      <img class="wordmark light-only" src="wordmark-light.png" alt="Screenpunk">
      <img class="wordmark dark-only" src="wordmark-dark.png" alt="">
    </header>
    <p class="kicker">WS ticker</p>
    <p id="tick" class="value">—</p>
    <p id="stale" class="stale" role="status"></p>
    <p id="native-status" class="note" hidden></p>
  </main>
  <script src="screenpunk.js"></script>
  <script src="app.js"></script>
</body>
</html>
